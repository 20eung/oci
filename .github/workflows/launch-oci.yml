name: OCI Instance Auto-Launch

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 실행
  workflow_dispatch:         # 수동 실행 가능

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: OCI CLI 설치
        run: pip install oci-cli -q --no-warn-script-location

      - name: OCI CLI 설정
        run: |
          mkdir -p ~/.oci

          cat > ~/.oci/config << EOF
[DEFAULT]
user=${{ secrets.OCI_USER_OCID }}
fingerprint=${{ secrets.OCI_FINGERPRINT }}
tenancy=${{ secrets.OCI_TENANCY_OCID }}
region=${{ secrets.OCI_REGION }}
key_file=~/.oci/private_key.pem
EOF

          echo '${{ secrets.OCI_PRIVATE_KEY }}' > ~/.oci/private_key.pem
          chmod 600 ~/.oci/config ~/.oci/private_key.pem

      - name: SSH 키 파일 생성
        run: echo '${{ secrets.OCI_SSH_PUBLIC_KEY }}' > /tmp/ssh_key.pub

      - name: 인스턴스 생성 시도
        id: launch
        run: |
          echo "시도 시간: $(date '+%Y-%m-%d %H:%M:%S %Z')"

          RESULT=$(oci compute instance launch \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --availability-domain "${{ secrets.OCI_AD }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 4, "memoryInGBs": 24}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --assign-public-ip true \
            --boot-volume-size-in-gbs 50 \
            --ssh-authorized-keys-file /tmp/ssh_key.pub \
            --display-name "oci-vm-auto" \
            2>&1) || true

          echo "$RESULT"

          if echo "$RESULT" | grep -q "ocid1.instance"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 생성 실패
        if: steps.launch.outputs.success == 'false'
        run: echo "생성 실패. 10분 후 재시도합니다."

      - name: 성공 시 GitHub Issue 생성
        if: steps.launch.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'OCI 인스턴스 생성 성공!',
              body: `인스턴스가 생성되었습니다!\n\n시간: ${new Date().toISOString()}\n\n**지금 바로 워크플로우를 비활성화하세요!**\nRepository → Actions → OCI Instance Auto-Launch → ... → Disable workflow`
            })

      - name: 성공 시 워크플로우 자동 비활성화
        if: steps.launch.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "인스턴스 생성 성공! 워크플로우를 비활성화합니다."
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/launch-oci.yml/disable"
